kind = "web"
previewPath = "/"
title = "EternalHardcore"
version = "1.0.0"
id = "artifacts/eternal-hardcore"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21284

[services.development]
run = "pnpm --filter @workspace/eternal-hardcore run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eternal-hardcore", "run", "build" ]
publicDir = "artifacts/eternal-hardcore/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21284"
BASE_PATH = "/"
